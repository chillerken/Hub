<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d12"><title>LuxAI voorstel</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070d12;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.05em}.brand b{color:#ffd34f}.back{color:#fff;text-decoration:none;border:1px solid #35536b;padding:10px 13px;border-radius:12px;background:#0d1720}.hero{padding:28px 0 12px}.hero h1{font-size:clamp(34px,7vw,62px);line-height:1.03;margin:0 0 10px}.muted{color:#aebbc5}.card{background:#0d151d;border:1px solid #20394d;border-radius:20px;padding:22px;margin-top:16px}.badge{display:inline-block;border:1px solid #ffd34f;color:#ffd34f;border-radius:999px;padding:7px 11px;font-weight:800}.pricegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.price{background:#081017;border:1px solid #2b465b;border-radius:14px;padding:16px}.price strong{display:block;font-size:30px;color:#ffd34f}.scope{display:grid;gap:10px;margin-top:12px}.scope div:before{content:'✓';color:#ffd34f;font-weight:900;margin-right:8px}.terms{white-space:pre-line;line-height:1.55;color:#c7d0d7}.acceptbox{display:grid;gap:12px}input[type=text]{width:100%;background:#081017;color:#fff;border:1px solid #345067;border-radius:11px;padding:13px;font-size:16px}.check{display:flex;gap:10px;align-items:flex-start;background:#081017;border:1px solid #2b465b;border-radius:12px;padding:12px}.check input{margin-top:3px}.btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:900;cursor:pointer}.primary{background:#ffd34f;color:#0a0a0a}.secondary{background:#111c25;color:#fff;border:1px solid #3b5365}.btn:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:14px;border-radius:12px}.msg.show{display:block}.ok{background:#0e2517;border:1px solid #315f3d;color:#d8ffe3}.warn{background:#251e0e;border:1px solid #6c5825;color:#fff0b6}.err{background:#2a1212;border:1px solid #753c3c;color:#ffc4c4}.hidden{display:none!important}@media(max-width:700px){.pricegrid{grid-template-columns:1fr}.card{padding:18px}.hero h1{font-size:40px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">LUX<b>AI</b> BUSINESS AUTOMATION</div><a class="back" href="https://luxai-business-scan.onrender.com/">← Scan</a></div><section class="hero"><h1>Jouw persoonlijk voorstel</h1><p class="muted">Bekijk scope, prijs en voorwaarden. Accepteer digitaal wanneer alles klopt.</p></section><section id="loading" class="card">Voorstel laden…</section><section id="proposal" class="hidden"><div class="card"><span id="status" class="badge"></span><h2 id="company"></h2><p class="muted">Pakket: <strong id="pkg"></strong></p><div class="pricegrid"><div class="price"><span>Eenmalige setup</span><strong id="setup"></strong></div><div class="price"><span>Maandabonnement</span><strong id="monthly"></strong></div></div><p id="vat" class="muted"></p></div><div class="card"><h2>Inbegrepen</h2><div id="scope" class="scope"></div></div><div class="card"><h2>Voorwaarden</h2><div id="terms" class="terms"></div><p class="muted">Geldig tot <span id="valid"></span>.</p></div><div id="acceptCard" class="card"><h2>Digitaal akkoord</h2><div class="acceptbox"><label>Naam van de aanvaarder<input id="signer" type="text" autocomplete="name" placeholder="Voor- en achternaam"></label><label class="check"><input id="agree" type="checkbox"><span>Ik heb dit voorstel en de voorwaarden gelezen en ga akkoord met de vermelde scope, setupprijs en maandelijkse abonnementsprijs. Ik begrijp dat implementatie pas start na bevestigde setupbetaling.</span></label><button id="accept" class="btn primary">Voorstel accepteren</button><button id="decline" class="btn secondary">Voorstel weigeren</button></div><div id="acceptMsg" class="msg"></div></div><div id="paymentCard" class="card hidden"><h2>Setupbetaling</h2><p id="paymentText"></p><a id="payLink" class="btn primary hidden" style="display:block;text-align:center;text-decoration:none" href="#">Betaal setup veilig</a></div></section><div id="fatal" class="msg err"></div></main><script>const API='https://nahwlhptgdkwhjcfkhkt.supabase.co/functions/v1/luxai-proposal-public';const token=new URLSearchParams(location.search).get('token')||'';const euro=n=>'€'+(Number(n||0)/100).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2});const label={starter:'Starter',professional:'Professional',ai_employee:'AI Employee',custom:'Maatwerk'};let proposal=null;function showMsg(el,text,type){el.textContent=text;el.className='msg show '+type}function render(d){proposal=d.proposal;document.getElementById('loading').classList.add('hidden');document.getElementById('proposal').classList.remove('hidden');document.getElementById('company').textContent=proposal.company_name;document.getElementById('pkg').textContent=label[proposal.package]||proposal.package;document.getElementById('setup').textContent=euro(proposal.setup_fee_cents);document.getElementById('monthly').textContent=euro(proposal.monthly_fee_cents)+'/maand';document.getElementById('status').textContent=proposal.status.toUpperCase();document.getElementById('vat').textContent=proposal.vat_status==='pending_configuration'?'Btw-behandeling wordt vóór betaling bevestigd. Er wordt nog niets geïnd.':(proposal.vat_status==='exclusive'?`Prijzen excl. ${proposal.vat_rate_pct||0}% btw.`:proposal.vat_status==='inclusive'?'Prijzen incl. btw.':'Btw-vrijstelling van toepassing.');const s=document.getElementById('scope');s.innerHTML='';(proposal.scope||[]).forEach(x=>{const e=document.createElement('div');e.textContent=x;s.appendChild(e)});document.getElementById('terms').textContent=proposal.terms_text;document.getElementById('valid').textContent=new Date(proposal.valid_until).toLocaleDateString('nl-BE');if(['accepted','declined','expired'].includes(proposal.status))document.getElementById('acceptCard').classList.add('hidden');if(proposal.status==='accepted')showPayment(d.payment,d.payment_ready);if(proposal.status==='declined')showMsg(document.getElementById('fatal'),'Dit voorstel werd geweigerd.','warn');if(proposal.status==='expired')showMsg(document.getElementById('fatal'),'Dit voorstel is verlopen. Vraag een nieuw voorstel aan.','warn')}function showPayment(p,ready){const c=document.getElementById('paymentCard'),t=document.getElementById('paymentText'),a=document.getElementById('payLink');c.classList.remove('hidden');if(p?.status==='paid'){t.textContent='Setupbetaling ontvangen. Je onboarding wordt automatisch gestart.';a.classList.add('hidden');return}if(ready&&p?.checkout_url){t.textContent='Je akkoord is geregistreerd. Rond nu de setupbetaling af om onboarding automatisch te starten.';a.href=p.checkout_url;a.classList.remove('hidden')}else{t.textContent='Je akkoord is geregistreerd. De veilige betaallink wordt beschikbaar zodra btw- en betaalproviderinstellingen bevestigd zijn.';a.classList.add('hidden')}}async function load(){try{if(!token)throw new Error();const r=await fetch(API+'?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok||!d.ok)throw new Error();render(d)}catch{document.getElementById('loading').classList.add('hidden');showMsg(document.getElementById('fatal'),'Dit voorstel is ongeldig, verlopen of niet beschikbaar.','err')}}async function action(kind){const btns=[document.getElementById('accept'),document.getElementById('decline')];btns.forEach(b=>b.disabled=true);try{const payload={token,action:kind};if(kind==='accept'){payload.signer_name=document.getElementById('signer').value;payload.accepted=document.getElementById('agree').checked}const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'error');if(kind==='accept'){document.getElementById('acceptCard').classList.add('hidden');showPayment(d.payment,d.payment_ready);showMsg(document.getElementById('fatal'),'Voorstel succesvol geaccepteerd. ✅','ok')}else{document.getElementById('acceptCard').classList.add('hidden');showMsg(document.getElementById('fatal'),'Voorstel geweigerd. We hebben dit geregistreerd.','warn')}}catch(e){showMsg(document.getElementById('acceptMsg'),e.message==='acceptance_required'?'Vul je naam in en vink het akkoord aan.':'De actie kon niet worden verwerkt. Probeer opnieuw.','err')}finally{btns.forEach(b=>b.disabled=false)}}document.getElementById('accept').onclick=()=>action('accept');document.getElementById('decline').onclick=()=>action('decline');load();</script></body></html>

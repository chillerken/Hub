project_id = "reception-ai-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = [
  "http://127.0.0.1:4173/**",
  "http://localhost:4173/**"
]
enable_signup = true
jwt_expiry = 3600

[auth.email]
enabled = true
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false


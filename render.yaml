services:
  - type: web
    name: ai-business-automation-prod
    runtime: node
    plan: free
    region: frankfurt
    branch: ai-business-production
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-business-automation-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: BUSINESS_WEBSITE
        sync: false
      - key: BUSINESS_AREA
        sync: false
      - key: BUSINESS_HOURS
        sync: false
      - key: GOOGLE_REVIEW_URL
        sync: false
      - key: BUSINESS_SERVICES
        sync: false
      - key: LEAD_FOLLOWUP_HOURS
        value: "24"
      - key: APPOINTMENT_REMINDER_HOURS
        value: "24"
      - key: AUTOMATION_INTERVAL_MINUTES
        value: "5"

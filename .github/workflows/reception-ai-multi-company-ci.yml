name: Reception AI multi-company validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ai-receptionist-host/app.js"
      - "ai-receptionist-host/supabase/**"
      - "ai-receptionist-host/tests/**"
      - ".github/workflows/reception-ai-multi-company-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Isolated database and code checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reception_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reception_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: reception_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare isolated Supabase-compatible schema
        run: psql -v ON_ERROR_STOP=1 -f ai-receptionist-host/tests/team-management-fixture.sql

      - name: Apply team management migration
        run: psql -v ON_ERROR_STOP=1 -f ai-receptionist-host/supabase/migrations/20261121112000_multi_company_context_and_team_invites.sql

      - name: Verify database constraints and access controls
        run: psql -v ON_ERROR_STOP=1 -f ai-receptionist-host/tests/team-management-assertions.sql

      - name: Check Edge Function types
        run: deno check ai-receptionist-host/supabase/functions/team-management/index.ts

      - name: Check frontend JavaScript syntax
        run: node --check ai-receptionist-host/app.js

      - name: Run team management contract tests
        run: node --test ai-receptionist-host/tests/team-management-contract.test.cjs

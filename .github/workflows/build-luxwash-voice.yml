name: Build LuxWash Voice APK

on:
  push:
    branches: [luxwash-voice-assistant]
    paths:
      - 'luxwash-voice/**'
      - '.github/workflows/build-luxwash-voice.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test
        working-directory: luxwash-voice
        run: gradle testDebugUnitTest --stacktrace
      - name: Build APK
        working-directory: luxwash-voice
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: luxwash-voice-debug-apk
          path: luxwash-voice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Dender County browser smoke

on:
  push:
    branches: [dender-county-3d]
    paths:
      - 'dender-county-3d/index.html'
      - 'dender-county-3d/style.css'
      - 'dender-county-3d/game.js'
      - 'dender-county-3d/sw.js'
      - 'dender-county-3d/geodata/**'
      - '.github/workflows/browser-smoke-dender.yml'

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 8080 --directory dender-county-3d >/tmp/dender-http.log 2>&1 &
          echo $! >/tmp/dender-http.pid
          sleep 2
          curl --fail http://127.0.0.1:8080/index.html >/dev/null
      - name: Run WebGL browser smoke
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({
              headless:true,
              args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']
            });
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[],failed=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('requestfailed',r=>failed.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));
            page.on('response',r=>{if(r.status()>=400)failed.push('http '+r.status()+': '+r.url())});
            await page.goto('http://127.0.0.1:8080/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('#startBtn',{timeout:30000});
            const scriptSrc=await page.evaluate(()=>document.querySelector('script[type="module"][src]')?.src||'');
            console.log('MODULE_SRC',scriptSrc);
            await page.click('#startBtn');
            await page.waitForTimeout(7000);
            const early=await page.evaluate(()=>({version:window.__DENDER_VERSION__||null,health:window.__DENDER_HEALTH__||null}));
            console.log('EARLY',JSON.stringify(early));
            console.log('EARLY_ERRORS',JSON.stringify(errors.slice(0,12)));
            console.log('FAILED_REQUESTS',JSON.stringify(failed.slice(0,12)));
            if(early.version!=='9.4')throw new Error('wrong runtime version '+early.version+' | '+errors.slice(0,6).join(' | ')+' | '+failed.slice(0,6).join(' | '));
            await page.waitForFunction(()=>window.__DENDER_HEALTH__?.geoActive===true,null,{timeout:120000});
            await page.waitForFunction(()=>window.__DENDER_HEALTH__?.saveVersion===3,null,{timeout:60000});
            await page.waitForFunction(()=>window.__DENDER_HEALTH__?.crossings>0,null,{timeout:90000});
            await page.waitForFunction(()=>window.__DENDER_HEALTH__?.playerAsset==='quaternius-human-cc0',null,{timeout:90000});
            await page.waitForFunction(()=>window.__DENDER_HEALTH__?.visibleTraffic>0,null,{timeout:90000});
            await page.waitForTimeout(3000);
            const health=await page.evaluate(()=>window.__DENDER_HEALTH__);
            const visual=await page.evaluate(()=>{
              const canvas=document.querySelector('#game').getBoundingClientRect();
              const body=getComputedStyle(document.body);
              const mission=getComputedStyle(document.querySelector('#missionBox'));
              const loading=document.querySelector('#loading');
              return {
                canvasW:canvas.width,canvasH:canvas.height,
                overflow:body.overflow,
                bodyBg:body.backgroundColor,
                missionPos:mission.position,
                loadingHidden:loading.classList.contains('hidden')
              };
            });
            console.log('HEALTH',JSON.stringify(health));
            console.log('VISUAL',JSON.stringify(visual));
            await page.screenshot({path:'/tmp/dender-smoke.png',fullPage:true});
            if(visual.canvasW<1200||visual.canvasH<680)throw new Error('canvas does not fill viewport');
            if(visual.overflow!=='hidden')throw new Error('visual shell broken: body overflow '+visual.overflow);
            if(visual.missionPos!=='absolute')throw new Error('HUD stylesheet missing');
            if(!visual.loadingHidden)throw new Error('loading overlay did not hide');
            if(!health.started)throw new Error('game did not start');
            if(!health.geoActive)throw new Error('real-world geography inactive');
            if(health.masterFrames<5)throw new Error('master loop not advancing');
            if(!health.quality)throw new Error('adaptive quality did not initialize');
            if(!health.buildingLod)throw new Error('building LOD did not initialize');
            if(health.saveVersion!==3)throw new Error('versioned save did not initialize: '+health.saveVersion);
            if(!(health.crossings>0))throw new Error('no exact railway crossings loaded: '+health.crossings);
            if(!(health.officialCrossings>0))throw new Error('official crossing source missing');
            if(!health.populationReady)throw new Error('adaptive population did not initialize');
            if(typeof health.visibleTraffic!=='number'||typeof health.visiblePeds!=='number')throw new Error('population health missing');
            if(!(health.visibleTraffic>0))throw new Error('traffic population remains hidden: '+health.visibleTraffic);
            if(health.playerAsset!=='quaternius-human-cc0')throw new Error('CC0 humanoid player not installed: '+health.playerAsset);
            if(!(health.playerAnimations>=1))throw new Error('player animation clips missing: '+health.playerAnimations);
            if(health.roads<2000)throw new Error('road graph too small: '+health.roads);
            if(health.nodes<500)throw new Error('routing graph too small: '+health.nodes);
            const fatal=errors.filter(e=>!e.includes('favicon')&&!e.includes('ERR_BLOCKED_BY_CLIENT'));
            if(fatal.length)throw new Error('browser errors: '+fatal.slice(0,8).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dender-county-browser-smoke
          path: /tmp/dender-smoke.png
          if-no-files-found: ignore
          retention-days: 7

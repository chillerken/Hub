name: LuxWash Playwright E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/free-playwright-e2e-*'

permissions:
  contents: read

concurrency:
  group: luxwash-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: LuxWash / Astra smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test LuxWash + Astra
        env:
          CI: 'true'
          LUXWASH_BASE_URL: https://www.luxwash.online/
        run: npx playwright test tests/luxwash-widget.spec.ts --project=chromium

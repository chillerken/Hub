name: Reception AI Public Appointment Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/public-demo-chat/**'
      - 'tests/reception-demo-date-context.test.mjs'
      - 'tests/reception-public-appointment-guard.test.mjs'
      - 'tests/reception-brussels-slot.test.mjs'
      - '.github/workflows/reception-public-appointment-guard.yml'
  push:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/public-demo-chat/**'
      - 'tests/reception-demo-date-context.test.mjs'
      - 'tests/reception-public-appointment-guard.test.mjs'
      - 'tests/reception-brussels-slot.test.mjs'
      - '.github/workflows/reception-public-appointment-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-public-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked handler test dependencies
        run: npm ci --ignore-scripts
      - name: Exercise real HTTP handler without external side effects
        run: node --test tests/reception-*.test.mjs tests/hub-typecheck-boundary.test.mjs ai-receptionist-host/tests/*.test.cjs luxwash-ai-os-host/sales/*.test.mjs luxwash-ai-os-host/stripe-webhook/edge-function/*.test.mjs

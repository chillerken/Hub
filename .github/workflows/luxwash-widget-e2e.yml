name: LuxWash Reception AI E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ai-receptionist-host/**'
      - 'tests/luxwash-widget.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/luxwash-widget-e2e.yml'
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: luxwash-reception-ai-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reception-ai-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Give production deploy a short head start
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Reception AI')
        run: sleep 20

      - name: Test live LuxWash Reception AI
        env:
          LUXWASH_BASE_URL: https://www.luxwash.online/
        run: npx playwright test tests/luxwash-widget.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxwash-reception-ai-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

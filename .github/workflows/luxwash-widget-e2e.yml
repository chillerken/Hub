name: LuxWash Reception AI E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
  deployment_status:

concurrency:
  group: luxwash-reception-ai-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reception-ai-e2e:
    if: >-
      github.event_name != 'deployment_status' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment_status.environment == 'Production' ||
          github.event.deployment_status.environment == 'production'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Give production deploy a short head start
        if: github.event_name == 'push'
        run: sleep 45

      - name: Test live LuxWash Reception AI
        env:
          LUXWASH_BASE_URL: https://www.luxwash.online/
        run: npx playwright test tests/luxwash-widget.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxwash-reception-ai-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

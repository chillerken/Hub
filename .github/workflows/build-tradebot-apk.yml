name: Build Tradebot APK

on:
  push:
    branches: [tradebot-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v1 source and apply v1.1 LAN patch
        shell: bash
        run: |
          base64 -d tradebot_android_src.zip.b64 > tradebot_android_src.zip
          unzip -o tradebot_android_src.zip
          cp tradebot_v11/Discovery.java app/src/main/java/online/luxwash/tradebot/Discovery.java
          python tradebot_v11/patch_v11.py
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/online/luxwash/tradebot/MainActivity.java
          grep -q "ZOEK BACKEND" app/src/main/java/online/luxwash/tradebot/MainActivity.java
          grep -q "versionName '1.1.0'" app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradebot-control-apk-v1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

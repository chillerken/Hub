name: Build Tradebot APK

on:
  push:
    branches: [tradebot-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          base64 -d tradebot_android_src.zip.b64 > tradebot_android_src.zip
          unzip -o tradebot_android_src.zip
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/online/luxwash/tradebot/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradebot-control-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

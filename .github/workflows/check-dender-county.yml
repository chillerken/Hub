name: Check Dender County 3D

on:
  push:
    branches: [dender-county-3d]
    paths:
      - 'dender-county-3d/**'
      - '.github/workflows/check-dender-county.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          cp dender-county-3d/game.js /tmp/dender-game.mjs
          node --check /tmp/dender-game.mjs
      - name: Validate real-world geography data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d/geodata")
          runtime=json.loads((root/"burst_runtime.geojson").read_text())
          meta=json.loads((root/"burst_meta.json").read_text())
          bounds=json.loads((root/"burst_boundaries.geojson").read_text())
          assert runtime["type"]=="FeatureCollection"
          roads=[f for f in runtime["features"] if f.get("properties",{}).get("kind")=="road"]
          stations=[f for f in runtime["features"] if f.get("properties",{}).get("kind")=="station"]
          assert len(roads)>100
          assert len(stations)>=1
          assert meta["wegenregister"]["reachable"] is True
          assert meta["wegenregister"]["sector_feature_count"]==len(roads)
          assert any(f.get("geometry",{}).get("type") in ("Polygon","MultiPolygon") for f in bounds["features"])
          print("real roads",len(roads),"named streets",meta["street_count_named"],"station",stations[0]["properties"].get("name"))
          PY
      - name: Validate integrated Erpe-Mere 2.0 systems
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d")
          meta=json.loads((root/"geodata/erpe_mere_meta.json").read_text())
          runtime=json.loads((root/"geodata/erpe_mere_runtime.geojson").read_text())
          roads=[f for f in runtime["features"] if f.get("properties",{}).get("kind")=="road"]
          routed=[f for f in roads if f.get("properties",{}).get("begin_node") is not None and f.get("properties",{}).get("end_node") is not None]
          assert len(roads)>2000, len(roads)
          assert len(routed)>1500, len(routed)
          assert meta["named_street_count"]>200
          game=(root/"game.js").read_text()
          assert "DENDER COUNTY 2.0" in game
          assert "JOB20.jobs" in game and ".slice(0,30)" in game
          assert "route10(" in game and "updatePolice10" in game
          assert "streamEnvironment20" in game and "updatePeds20" in game
          print("Erpe-Mere roads",len(roads),"routed",len(routed),"named",meta["named_street_count"])
          PY
      - name: Validate streamed environment data when present
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d/geodata")
          p=root/"erpe_mere_environment.geojson"
          m=root/"erpe_mere_environment_meta.json"
          if not p.exists():
              print("Environment import pending; runtime fallback remains valid.")
          else:
              fc=json.loads(p.read_text())
              meta=json.loads(m.read_text())
              buildings=[f for f in fc["features"] if f.get("properties",{}).get("kind")=="building"]
              assert len(buildings)>1000, len(buildings)
              assert meta["feature_count"]==len(fc["features"])
              assert "Digitaal Vlaanderen" in meta.get("primary_building_source","")
              print("environment features",len(fc["features"]),"buildings",len(buildings),meta.get("counts"))
          PY
      - name: Verify required game files
        run: |
          test -s dender-county-3d/index.html
          test -s dender-county-3d/style.css
          test -s dender-county-3d/game.js
          grep -q 'type="importmap"' dender-county-3d/index.html
          grep -q 'GLTFLoader' dender-county-3d/game.js
      - name: Inspect free Poly Haven manifest
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
            "https://api.polyhaven.com/files/covered_car",
            headers={"User-Agent":"DenderCounty/0.8 (https://dender-county-3d.onrender.com)"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
            data=json.load(r)
          def walk(x,path="root"):
            if isinstance(x,dict):
              for k,v in x.items(): walk(v,path+"."+k)
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,path+f"[{i}]")
            elif isinstance(x,str) and ("gltf" in x.lower() or x.lower().endswith(".glb")):
              print(path, x)
          walk(data)
          PY
      - name: Verify Poly Haven runtime assets
        run: |
          for url in             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/asphalt_01/asphalt_01_diff_1k.png             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/asphalt_01/asphalt_01_nor_gl_1k.png             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/asphalt_01/asphalt_01_arm_1k.png             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/brick_wall_07/brick_wall_07_diff_1k.png             https://dl.polyhaven.org/file/ph-assets/Models/gltf/1k/covered_car/covered_car_1k.gltf
          do
            curl -L --fail --retry 2 --max-time 30 -o /tmp/ph_asset "$url"
            test -s /tmp/ph_asset
          done
      - name: Verify production GLB asset
        run: |
          curl -L --fail --retry 2 --max-time 30 \
            -o /tmp/toycar.glb \
            https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/ToyCar/glTF-Binary/ToyCar.glb
          test -s /tmp/toycar.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/toycar.glb')
          assert p.read_bytes()[:4] == b'glTF', 'Invalid GLB magic'
          print('ToyCar GLB OK', p.stat().st_size)
          PY
          curl -L --fail --retry 2 --max-time 30 \
            -o /tmp/riggedfigure.glb \
            https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/RiggedFigure/glTF-Binary/RiggedFigure.glb
          test -s /tmp/riggedfigure.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/riggedfigure.glb')
          assert p.read_bytes()[:4] == b'glTF', 'Invalid RiggedFigure GLB magic'
          print('RiggedFigure GLB OK', p.stat().st_size)
          PY

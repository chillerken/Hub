name: Check Dender County 3D

on:
  push:
    branches: [dender-county-3d]
    paths:
      - 'dender-county-3d/**'
      - '.github/workflows/check-dender-county.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          cp dender-county-3d/game.js /tmp/dender-game.mjs
          node --check /tmp/dender-game.mjs
      - name: Validate real-world geography data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d/geodata")
          runtime=json.loads((root/"burst_runtime.geojson").read_text())
          meta=json.loads((root/"burst_meta.json").read_text())
          bounds=json.loads((root/"burst_boundaries.geojson").read_text())
          assert runtime["type"]=="FeatureCollection"
          roads=[f for f in runtime["features"] if f.get("properties",{}).get("kind")=="road"]
          stations=[f for f in runtime["features"] if f.get("properties",{}).get("kind")=="station"]
          assert len(roads)>100
          assert len(stations)>=1
          assert meta["wegenregister"]["reachable"] is True
          assert meta["wegenregister"]["sector_feature_count"]==len(roads)
          assert any(f.get("geometry",{}).get("type") in ("Polygon","MultiPolygon") for f in bounds["features"])
          print("real roads",len(roads),"named streets",meta["street_count_named"],"station",stations[0]["properties"].get("name"))
          PY
      - name: Validate integrated Erpe-Mere 2.0 systems
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d")
          meta=json.loads((root/"geodata/erpe_mere_meta.json").read_text())
          runtime=json.loads((root/"geodata/erpe_mere_runtime.geojson").read_text())
          roads=[f for f in runtime["features"] if f.get("properties",{}).get("kind")=="road"]
          routed=[f for f in roads if f.get("properties",{}).get("begin_node") is not None and f.get("properties",{}).get("end_node") is not None]
          assert len(roads)>2000, len(roads)
          assert len(routed)>1500, len(routed)
          assert meta["named_street_count"]>200
          game=(root/"game.js").read_text()
          assert "DENDER COUNTY 2.0" in game
          assert "JOB20.jobs" in game and ".slice(0,30)" in game
          assert "route10(" in game and "updatePolice10" in game
          assert "streamEnvironment20" in game and "updatePeds20" in game
          print("Erpe-Mere roads",len(roads),"routed",len(routed),"named",meta["named_street_count"])
          PY
      - name: Validate streamed environment data when present
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d/geodata")
          p=root/"erpe_mere_environment.geojson"
          m=root/"erpe_mere_environment_meta.json"
          if not p.exists():
              print("Environment import pending; runtime fallback remains valid.")
          else:
              fc=json.loads(p.read_text())
              meta=json.loads(m.read_text())
              buildings=[f for f in fc["features"] if f.get("properties",{}).get("kind")=="building"]
              assert len(buildings)>1000, len(buildings)
              assert meta["feature_count"]==len(fc["features"])
              assert "Digitaal Vlaanderen" in meta.get("primary_building_source","")
              print("environment features",len(fc["features"]),"buildings",len(buildings),meta.get("counts"))
          PY
      - name: Validate Dender County 3.0 regional world
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d/geodata")
          for key,min_roads,min_streets in [
              ("erpe_mere",2000,200),
              ("lede",1500,300),
              ("aalst",5000,700),
          ]:
              meta=json.loads((root/f"{key}_meta.json").read_text())
              runtime=json.loads((root/f"{key}_runtime.geojson").read_text())
              roads=[f for f in runtime["features"] if f.get("properties",{}).get("kind")=="road"]
              assert len(roads)>=min_roads,(key,len(roads))
              count=meta.get("named_street_count",meta.get("street_count_named",0))
              assert count>=min_streets,(key,count)
              assert all("begin_node" in f.get("properties",{}) and "end_node" in f.get("properties",{}) for f in roads[:100])
              print(key,"roads",len(roads),"streets",count)
          for key,min_buildings in [("erpe_mere",15000),("lede",3000),("aalst",10000)]:
              p=root/f"{key}_environment_meta.json"
              assert p.exists(),f"missing {p}"
              m=json.loads(p.read_text())
              b=m.get("counts",{}).get("building",0)
              assert b>=min_buildings,(key,b)
              print(key,"buildings",b,"environment",m.get("feature_count"))
          PY
      - name: Validate 3.1 streamed chunk manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d/geodata")
          base=json.loads((root/"erpe_mere_meta.json").read_text())
          origin=base["center_wgs84"]
          for key in ("erpe_mere","lede","aalst"):
              env=root/f"{key}_environment_meta.json"
              manifest=root/"chunks"/key/"manifest.json"
              if not env.exists() or not manifest.exists():
                  raise AssertionError(f"missing streamed environment for {key}")
              em=json.loads(env.read_text())
              m=json.loads(manifest.read_text())
              assert abs(m["origin_wgs84"]["lat"]-origin["lat"])<1e-9
              assert abs(m["origin_wgs84"]["lon"]-origin["lon"])<1e-9
              assert m["chunk_size_m"]==750.0
              total=sum(x["features"] for x in m["chunks"])
              assert total==em["feature_count"],(key,total,em["feature_count"])
              assert len(m["chunks"])>10
              print(key,"chunks",len(m["chunks"]),"features",total)
          PY
      - name: Validate reproducible asset manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("dender-county-3d")
          m=json.loads((root/"assets-manifest.json").read_text())
          assert m["gameVersion"]=="9.2"
          assert m["runtime"]["three"]=="0.180.0"
          sha=m["runtime"]["khronosSampleAssetsCommit"]
          assert len(sha)==40
          for a in m["assets"]:
              assert a["license"]
              assert a["attribution"]
              if "KhronosGroup" in a["url"]:
                  assert "@"+sha+"/" in a["url"]
          game=(root/"game.js").read_text()
          assert "glTF-Sample-Assets@main" not in game
          assert game.count("requestAnimationFrame(")==1
          assert "window.__DENDER_HEALTH__" in game
          assert (root/"sw.js").exists()
          print("manifest assets",len(m["assets"]),"single RAF OK")
          PY
      - name: Verify required game files
        run: |
          test -s dender-county-3d/index.html
          test -s dender-county-3d/style.css
          test -s dender-county-3d/game.js
          grep -q 'type="importmap"' dender-county-3d/index.html
          grep -q 'GLTFLoader' dender-county-3d/game.js
          grep -q 'SkeletonUtils' dender-county-3d/game.js
          grep -q 'DENDER COUNTY 4.0' dender-county-3d/game.js
      - name: Inspect free Poly Haven manifest
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
            "https://api.polyhaven.com/files/covered_car",
            headers={"User-Agent":"DenderCounty/0.8 (https://dender-county-3d.onrender.com)"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
            data=json.load(r)
          def walk(x,path="root"):
            if isinstance(x,dict):
              for k,v in x.items(): walk(v,path+"."+k)
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,path+f"[{i}]")
            elif isinstance(x,str) and ("gltf" in x.lower() or x.lower().endswith(".glb")):
              print(path, x)
          walk(data)
          PY
      - name: Verify Poly Haven runtime assets
        run: |
          for url in             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/asphalt_01/asphalt_01_diff_1k.png             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/asphalt_01/asphalt_01_nor_gl_1k.png             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/asphalt_01/asphalt_01_arm_1k.png             https://dl.polyhaven.org/file/ph-assets/Textures/png/1k/brick_wall_07/brick_wall_07_diff_1k.png
          do
            curl -L --fail --retry 2 --max-time 30 -o /tmp/ph_asset "$url"
            test -s /tmp/ph_asset
          done
      - name: Verify production GLB asset
        run: |
          curl -L --fail --retry 2 --max-time 30 \
            -o /tmp/toycar.glb \
            https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@c6a6bd13ab2b3c685c7903d03561b8a9392f38b8/Models/ToyCar/glTF-Binary/ToyCar.glb
          test -s /tmp/toycar.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/toycar.glb')
          assert p.read_bytes()[:4] == b'glTF', 'Invalid GLB magic'
          print('ToyCar GLB OK', p.stat().st_size)
          PY
          curl -L --fail --retry 2 --max-time 30 \
            -o /tmp/riggedfigure.glb \
            https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@c6a6bd13ab2b3c685c7903d03561b8a9392f38b8/Models/RiggedFigure/glTF-Binary/RiggedFigure.glb
          test -s /tmp/riggedfigure.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/riggedfigure.glb')
          assert p.read_bytes()[:4] == b'glTF', 'Invalid RiggedFigure GLB magic'
          print('RiggedFigure GLB OK', p.stat().st_size)
          PY
          curl -L --fail --retry 2 --max-time 30 \
            -o /tmp/deliverytruck.glb \
            https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@c6a6bd13ab2b3c685c7903d03561b8a9392f38b8/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb
          test -s /tmp/deliverytruck.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/deliverytruck.glb')
          assert p.read_bytes()[:4] == b'glTF', 'Invalid DeliveryTruck GLB magic'
          print('DeliveryTruck GLB OK', p.stat().st_size)
          PY

name: Reception AI Commercial Booking Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/operations-admin/**'
      - 'ai-receptionist-host/supabase/functions/workflow-runner/**'
      - 'ai-receptionist-host/supabase/functions/production-e2e-check/**'
      - 'ai-receptionist-host/docs/COMMERCIAL-RELEASE-GATE.md'
      - 'ai-receptionist-host/docs/VALIDATION-EVIDENCE-2026-10-11.md'
      - 'tests/reception-ai-commercial-booking-gate.test.mjs'
      - 'tests/reception-full-chain-endpoint.test.mjs'
      - 'tests/reception-provider-delivery-mock.test.mjs'
      - 'tests/reception-appointment-lifecycle-schema.pg.sql'
      - 'tests/reception-appointment-lifecycle.pg.sql'
      - 'ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql'
      - '.github/workflows/reception-ai-commercial-booking-gate.yml'
  push:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/operations-admin/**'
      - 'ai-receptionist-host/supabase/functions/workflow-runner/**'
      - 'ai-receptionist-host/supabase/functions/production-e2e-check/**'
      - 'ai-receptionist-host/docs/COMMERCIAL-RELEASE-GATE.md'
      - 'ai-receptionist-host/docs/VALIDATION-EVIDENCE-2026-10-11.md'
      - 'tests/reception-ai-commercial-booking-gate.test.mjs'
      - 'tests/reception-full-chain-endpoint.test.mjs'
      - 'tests/reception-provider-delivery-mock.test.mjs'
      - 'tests/reception-appointment-lifecycle-schema.pg.sql'
      - 'tests/reception-appointment-lifecycle.pg.sql'
      - 'ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql'
      - '.github/workflows/reception-ai-commercial-booking-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-booking-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned TypeScript transpiler for real-handler VM tests
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.2
      - name: Verify real HTTP handlers and tenant safety
        run: node --test tests/reception-ai-commercial-booking-gate.test.mjs tests/reception-full-chain-endpoint.test.mjs tests/reception-provider-delivery-mock.test.mjs

  postgres-trigger-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_fixture_only
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable database fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/reception-appointment-lifecycle-schema.pg.sql
      - name: Install proposed SQL function in disposable Postgres only
        run: psql -v ON_ERROR_STOP=1 -f ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql
      - name: Verify real SQL trigger, human approval, idempotency and tenant boundaries
        run: psql -v ON_ERROR_STOP=1 -f tests/reception-appointment-lifecycle.pg.sql

name: Reception AI Commercial Booking Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/operations-admin/**'
      - 'ai-receptionist-host/supabase/functions/workflow-runner/**'
      - 'ai-receptionist-host/supabase/functions/production-e2e-check/**'
      - 'ai-receptionist-host/docs/COMMERCIAL-RELEASE-GATE.md'
      - 'tests/reception-ai-commercial-booking-gate.test.mjs'
      - 'tests/reception-full-chain-endpoint.test.mjs'
      - '.github/workflows/reception-ai-commercial-booking-gate.yml'
  push:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/operations-admin/**'
      - 'ai-receptionist-host/supabase/functions/workflow-runner/**'
      - 'ai-receptionist-host/supabase/functions/production-e2e-check/**'
      - 'ai-receptionist-host/docs/COMMERCIAL-RELEASE-GATE.md'
      - 'tests/reception-ai-commercial-booking-gate.test.mjs'
      - 'tests/reception-full-chain-endpoint.test.mjs'
      - '.github/workflows/reception-ai-commercial-booking-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-booking-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned TypeScript transpiler for real-handler VM tests
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.2
      - name: Verify real HTTP handlers and tenant safety
        run: node --test tests/reception-ai-commercial-booking-gate.test.mjs tests/reception-full-chain-endpoint.test.mjs

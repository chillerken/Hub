name: Reception AI Commercial Booking Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/operations-admin/**'
      - 'ai-receptionist-host/supabase/functions/workflow-runner/**'
      - 'ai-receptionist-host/supabase/functions/production-e2e-check/**'
      - 'ai-receptionist-host/docs/COMMERCIAL-RELEASE-GATE.md'
      - 'ai-receptionist-host/docs/VALIDATION-EVIDENCE-2026-10-11.md'
      - 'tests/reception-ai-commercial-booking-gate.test.mjs'
      - 'tests/reception-full-chain-endpoint.test.mjs'
      - 'tests/reception-provider-delivery-mock.test.mjs'
      - 'tests/reception-postgres-full-chain.test.mjs'
      - 'tests/reception-postgres-handler-fixture.pg.sql'
      - 'tests/reception-postgres-tenant-rls.pg.sql'
      - 'tests/reception-supabase-local-rls.pg.sql'
      - 'tests/reception-supabase-local-auth-api.test.mjs'
      - 'tests/reception-appointment-lifecycle-schema.pg.sql'
      - 'tests/reception-appointment-lifecycle.pg.sql'
      - 'ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql'
      - '.github/workflows/reception-ai-commercial-booking-gate.yml'
  push:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/public-reception-chat/**'
      - 'ai-receptionist-host/supabase/functions/operations-admin/**'
      - 'ai-receptionist-host/supabase/functions/workflow-runner/**'
      - 'ai-receptionist-host/supabase/functions/production-e2e-check/**'
      - 'ai-receptionist-host/docs/COMMERCIAL-RELEASE-GATE.md'
      - 'ai-receptionist-host/docs/VALIDATION-EVIDENCE-2026-10-11.md'
      - 'tests/reception-ai-commercial-booking-gate.test.mjs'
      - 'tests/reception-full-chain-endpoint.test.mjs'
      - 'tests/reception-provider-delivery-mock.test.mjs'
      - 'tests/reception-postgres-full-chain.test.mjs'
      - 'tests/reception-postgres-handler-fixture.pg.sql'
      - 'tests/reception-postgres-tenant-rls.pg.sql'
      - 'tests/reception-supabase-local-rls.pg.sql'
      - 'tests/reception-supabase-local-auth-api.test.mjs'
      - 'tests/reception-appointment-lifecycle-schema.pg.sql'
      - 'tests/reception-appointment-lifecycle.pg.sql'
      - 'ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql'
      - '.github/workflows/reception-ai-commercial-booking-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-booking-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned TypeScript transpiler for real-handler VM tests
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.2
      - name: Verify real HTTP handlers and tenant safety
        run: node --test tests/reception-ai-commercial-booking-gate.test.mjs tests/reception-full-chain-endpoint.test.mjs tests/reception-provider-delivery-mock.test.mjs

  postgres-trigger-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_fixture_only
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable database fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/reception-appointment-lifecycle-schema.pg.sql
      - name: Install proposed SQL function in disposable Postgres only
        run: psql -v ON_ERROR_STOP=1 -f ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql
      - name: Verify real SQL trigger, human approval, idempotency and tenant boundaries
        run: psql -v ON_ERROR_STOP=1 -f tests/reception-appointment-lifecycle.pg.sql

  postgres-handler-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RECEPTION_CI_ISOLATED: 'yes'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_fixture_only
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable PostgreSQL test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.2 pg@8.16.3
      - name: Install PostgreSQL command line client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Prepare local tables only
        run: psql -v ON_ERROR_STOP=1 -f tests/reception-appointment-lifecycle-schema.pg.sql
      - name: Install SQL release-candidate function in local Postgres
        run: psql -v ON_ERROR_STOP=1 -f ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql
      - name: Install handler integration fixtures and trigger locally
        run: psql -v ON_ERROR_STOP=1 -f tests/reception-postgres-handler-fixture.pg.sql
      - name: Execute real handlers and worker against disposable Postgres and fake provider
        run: node --test tests/reception-postgres-full-chain.test.mjs
      - name: Reject cross-tenant database writes using actual PostgreSQL RLS
        run: psql -v ON_ERROR_STOP=1 -f tests/reception-postgres-tenant-rls.pg.sql

  supabase-local-real-auth-api:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      RECEPTION_CI_ISOLATED: 'yes'
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Supabase local CLI (no connected cloud project)
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Verify local CLI commands and initialize standalone test stack
        run: |
          supabase --version
          supabase init --help
          supabase start --help
          supabase functions serve --help
          supabase init
      - name: Start ephemeral Auth, PostgREST, Kong, Edge and Postgres
        run: |
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,mailpit,logflare,vector,supavisor
      - name: Prepare isolated local database and staging-only RLS policies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          supabase status -o env > /tmp/reception-ci-local.env
          set -a
          source /tmp/reception-ci-local.env
          set +a
          test -n "$DB_URL" && test -n "$API_URL"
          test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *) echo "Refusing nonlocal API"; exit 1 ;;
          esac
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          printf 'API_URL=%s\nANON_KEY=%s\nSERVICE_ROLE_KEY=%s\n' "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/reception-appointment-lifecycle-schema.pg.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ai-receptionist-host/supabase/migrations/20261011180000_require_human_confirmation_before_calendar_sync.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/reception-postgres-handler-fixture.pg.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/reception-supabase-local-rls.pg.sql
      - name: Install local API client and make Edge function sources available
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @supabase/supabase-js@2.95.0
          mkdir -p supabase/functions
          cp -R ai-receptionist-host/supabase/functions/public-reception-chat supabase/functions/
          cp -R ai-receptionist-host/supabase/functions/operations-admin supabase/functions/
      - name: Launch local Deno Edge Functions (no provider secrets)
        run: |
          nohup supabase functions serve --no-verify-jwt > /tmp/reception-ci-edge.log 2>&1 </dev/null &
          echo $! > /tmp/reception-ci-edge.pid
      - name: Test actual Auth, PostgREST and Edge booking security
        run: node --test tests/reception-supabase-local-auth-api.test.mjs
      - name: Print sanitized failure diagnostics
        if: failure()
        run: |
          tail -n 100 /tmp/reception-ci-edge.log 2>/dev/null | sed -E 's/(eyJ[A-Za-z0-9_-]{50,})/[MASKED]/g' || true
      - name: Stop and destroy temporary Supabase instance
        if: always()
        run: supabase stop --no-backup || true

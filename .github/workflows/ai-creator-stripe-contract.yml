name: AI Creator Stripe webhook contract

on:
  pull_request:
    paths:
      - 'luxwash-ai-os-host/stripe-webhook/**'
      - 'luxwash-ai-os-host/sales/**'
      - '.github/workflows/ai-creator-stripe-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-signature-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check signature helper syntax
        run: node --check luxwash-ai-os-host/stripe-webhook/edge-function/verify.mjs
      - name: Verify Stripe HMAC behavior (no live Stripe / no DB writes)
        run: node --test luxwash-ai-os-host/stripe-webhook/edge-function/verify.test.mjs
      - name: Verify €19 Founding Beta eligibility and cross-product isolation
        run: node --test luxwash-ai-os-host/stripe-webhook/edge-function/entitlement-policy.test.mjs
      - name: Verify sales lifecycle (fake contacts, no sending)
        run: node --test luxwash-ai-os-host/sales/followup-lifecycle.test.mjs

  isolated-billing-rpc-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify restricted billing RPC and replay behavior
        env:
          PGPASSWORD: local-ci-only-password
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f luxwash-ai-os-host/stripe-webhook/tests/billing-rpc.pg.sql

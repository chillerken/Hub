name: LuxWash identity-bound approval regression

on:
  pull_request:
    paths:
      - 'luxwash-ai-os-host/migrations/20261010_identity_bound_approval_v1.sql'
      - 'luxwash-ai-os-host/tests/identity-bound-approval.pg.sql'
      - '.github/workflows/luxwash-identity-approval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-identity-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify owner identity, opt-out, no-contact, replay and receipt-safe behavior
        env:
          PGPASSWORD: disposable-ci
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f luxwash-ai-os-host/tests/identity-bound-approval.pg.sql

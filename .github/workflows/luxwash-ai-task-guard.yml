name: LuxWash AI task approval guard

on:
  pull_request:
    paths:
      - 'luxwash-ai-os-host/migrations/20261010_guard_approval_required_ai_tasks.sql'
      - 'luxwash-ai-os-host/tests/task-approval-guard.pg.sql'
      - '.github/workflows/luxwash-ai-task-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-isolated-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run isolated approval-safety regression
        env:
          PGPASSWORD: local-ci-only-password
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f luxwash-ai-os-host/tests/task-approval-guard.pg.sql

name: LuxWash build and tests

on:
  push:
    branches: [ai-business-production]
  pull_request:
    branches: [ai-business-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luxwash-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install, build React, and run isolated Node tests
        run: npm ci
      - name: Check backend syntax
        run: npm run check

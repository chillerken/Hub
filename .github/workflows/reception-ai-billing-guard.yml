name: Reception AI Billing Event Safety

on:
  push:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/stripe-webhook/**'
      - 'tests/reception-billing-event-guard.test.mjs'
      - 'tests/reception-stripe-webhook-sandbox.test.mjs'
      - '.github/workflows/reception-ai-billing-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-receptionist-host/supabase/functions/stripe-webhook/**'
      - 'tests/reception-billing-event-guard.test.mjs'
      - 'tests/reception-stripe-webhook-sandbox.test.mjs'
      - '.github/workflows/reception-ai-billing-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-stripe-event-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure billing event transition tests
        run: node --test tests/reception-billing-event-guard.test.mjs
      - name: Check TypeScript webhook syntax
        run: |
          npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.2
          node --input-type=module -e '
          import ts from "typescript";
          import fs from "node:fs";
          const file = "ai-receptionist-host/supabase/functions/stripe-webhook/index.ts";
          const source = fs.readFileSync(file, "utf8");
          const ast = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          if (ast.parseDiagnostics.length) {
            console.error(ts.formatDiagnosticsWithColorAndContext(ast.parseDiagnostics, {
              getCanonicalFileName: (x) => x,
              getCurrentDirectory: () => process.cwd(),
              getNewLine: () => "\n",
            }));
            process.exitCode = 1;
          }
          '
      - name: Run signed Stripe webhook simulation (no external APIs)
        run: node --test tests/reception-stripe-webhook-sandbox.test.mjs

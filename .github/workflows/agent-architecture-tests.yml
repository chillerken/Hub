name: Agent Architecture Tests
on:
  pull_request:
    paths:
      - 'ai-receptionist-host/agents/**'
      - 'docs/agent-architecture-v1.md'
      - 'docs/business-control-dashboard-v1.md'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes tsx ai-receptionist-host/agents/runtime.test.ts
      - run: npx --yes tsx ai-receptionist-host/agents/business-control.test.ts

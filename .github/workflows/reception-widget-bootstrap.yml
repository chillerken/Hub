name: Reception AI widget bootstrap
on:
  pull_request:
    paths:
      - 'ai-receptionist-host/widget.js'
      - 'ai-receptionist-host/tests/widget-bootstrap-regression.test.cjs'
      - '.github/workflows/reception-widget-bootstrap.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check ai-receptionist-host/widget.js
      - name: Run isolated widget bootstrap tests
        run: node --test ai-receptionist-host/tests/widget-bootstrap-regression.test.cjs

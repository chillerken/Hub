name: Reception AI E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: reception-ai-e2e
  cancel-in-progress: true

jobs:
  smoke-test:
    name: LuxWash widget smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Reception AI smoke test
        env:
          SITE_URL: https://www.luxwash.online/
          WIDGET_TOKEN: 597f9789-be65-4ab8-bdbe-276f696991f1
        run: node tests/reception-ai-smoke.mjs

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reception-ai-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

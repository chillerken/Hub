name: Build FitLog APK

on:
  push:
    branches: [fitness-tracker-apk]
    paths:
      - 'fitness-tracker/**'
      - '.github/workflows/fitness-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Build debug APK
        working-directory: fitness-tracker
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitLog-APK
          path: fitness-tracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
